<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Paxi Game Hub</title>
<meta name="description" content="Paxi Network 链上游戏大厅">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236ee7b7'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='%230b0f1a'>G</text></svg>">
<style>
/* ========== 变量 ========== */
:root {
  --bg: #0b0f1a;
  --card: #151c2c;
  --card-2: #1c2438;
  --border: #2a3654;
  --text: #e5e7eb;
  --muted: #8b98ad;
  --accent: #6ee7b7;
  --accent-2: #60a5fa;
  --gold: #fbbf24;
  --danger: #f87171;
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  overscroll-behavior-y: none;
  padding-bottom: calc(64px + var(--safe-bottom));
}

/* ========== Header ========== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(21,28,44,.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: calc(10px + var(--safe-top)) 14px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.logo {
  width: 30px; height: 30px; border-radius: 9px; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.brand-name { font-size: 15px; font-weight: 800; white-space: nowrap; }
.hdr-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.chip {
  font-size: 11px; padding: 4px 8px; border-radius: 999px;
  background: var(--card-2); border: 1px solid var(--border);
  color: var(--muted); font-family: ui-monospace, monospace;
  max-width: 104px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip.bal { color: var(--accent); border-color: #14532d; }

/* ========== 主区 ========== */
.main { max-width: 520px; margin: 0 auto; padding: 14px 14px 8px; }

/* ========== 卡片 ========== */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
}
.card-title {
  font-size: 14px; font-weight: 700; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.desc { font-size: 12px; color: var(--muted); line-height: 1.6; word-break: break-word; }
.desc code, code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px; background: rgba(0,0,0,.05);
  padding: 1px 5px; border-radius: 4px; word-break: break-all;
}

/* ========== 余额条 ========== */
.balance-bar {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin-bottom: 12px;
}
.bal-item {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 6px; text-align: center;
}
.bal-val { font-size: 15px; font-weight: 800; color: var(--accent); font-family: ui-monospace, monospace; }
.bal-val.small { font-size: 13px; }
.bal-lab { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* ========== 游戏网格（2 列，手机最舒服） ========== */
.game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.game-card {
  background: var(--card-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; transition: transform .12s;
  min-height: 104px; justify-content: center; text-align: center;
}
.game-card:active { transform: scale(.96); background: #223052; }
.game-card.disabled { opacity: .45; pointer-events: none; }
.game-icon { font-size: 32px; line-height: 1.1; }
.game-name { font-size: 13px; font-weight: 700; }
.game-desc { font-size: 10px; color: var(--muted); line-height: 1.35; }
.game-tag {
  font-size: 10px; color: var(--accent); margin-top: 3px;
  font-family: ui-monospace, monospace;
}

/* ========== 返回栏 ========== */
.back-bar {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--muted); font-size: 13px; margin-bottom: 10px;
  padding: 6px 0; cursor: pointer;
}
.back-bar:active { color: var(--text); }

/* ========== 表单 ========== */
.field { margin-bottom: 12px; }
.label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
input[type="text"], input[type="number"], select {
  width: 100%; padding: 11px 12px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 15px;
  -webkit-appearance: none; appearance: none;
  transition: border-color .15s;
}
input:focus, select:focus { outline: none; border-color: var(--accent); }
select { font-family: inherit; cursor: pointer; }
input.mono { font-family: ui-monospace, monospace; }
.row { display: flex; gap: 8px; align-items: center; }
.row .grow { flex: 1 1 auto; min-width: 0; }

/* 快捷金额 */
.quick-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.quick {
  padding: 5px 10px; font-size: 11px; border-radius: 999px;
  background: var(--card-2); border: 1px solid var(--border); color: var(--muted);
}
.quick:active { background: var(--accent); color: #052e1e; }

/* ========== 按钮 ========== */
.btn {
  padding: 12px 18px; border-radius: 10px; border: none;
  font-size: 15px; font-weight: 700; cursor: pointer;
  min-height: 46px; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform .1s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; }
.btn-primary { background: var(--accent); color: #052e1e; }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 600; }
.btn-gold { background: var(--gold); color: #3b2a05; }
.btn-sm {
  width: auto; min-height: 34px; padding: 7px 14px;
  font-size: 13px; border-radius: 8px;
}

/* ========== 下注选项 ========== */
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 7px; }
.opt-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.opt {
  padding: 12px 4px; border-radius: 10px; font-size: 14px; font-weight: 600;
  background: var(--card-2); border: 1px solid var(--border); color: var(--text);
  min-height: 48px;
}
.opt:active { transform: scale(.96); }
.opt.sel { background: var(--accent); color: #052e1e; border-color: var(--accent); }
.opt small { display: block; font-size: 10px; opacity: .8; margin-top: 2px; font-weight: 500; }
.opt:disabled { opacity: .35; }
.opt.dim { opacity: .55; }

/* ========== 骰子 / 卡牌结果 ========== */
.result-stage {
  background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; text-align: center; margin-bottom: 10px; min-height: 72px;
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px;
}
.dice-face {
  width: 46px; height: 46px; border-radius: 10px;
  background: var(--card-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800;
}
.pcard {
  width: 44px; height: 62px; border-radius: 8px; background: #f8fafc;
  color: #0f172a; display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-weight: 800; font-size: 17px;
  border: 1px solid #cbd5e1;
}
.pcard.red { color: #dc2626; }
.pcard small { font-size: 15px; font-weight: 600; }
.big-result { font-size: 34px; font-weight: 800; color: var(--accent); }
.placeholder-txt { color: var(--muted); font-size: 12px; }

/* ========== 赔率表 ========== */
.odds-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; min-width: 300px; }
th {
  text-align: left; padding: 6px 6px; color: var(--muted); font-weight: 600;
  border-bottom: 1px solid var(--border); font-size: 10px; white-space: nowrap;
}
td { padding: 6px 6px; border-bottom: 1px solid var(--border); }
td.num { font-family: ui-monospace, monospace; text-align: right; white-space: nowrap; }
.warn-txt { color: var(--gold); }
.ok-txt { color: var(--accent); }

/* ========== 键值行 ========== */
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 12px; }
.kv + .kv { border-top: 1px solid rgba(42,54,84,.5); }
.kv .k { color: var(--muted); flex: 0 0 auto; }
.kv .v { font-family: ui-monospace, monospace; text-align: right; word-break: break-all; max-width: 62%; }

/* ========== 提示条 ========== */
.hint {
  background: rgba(251,191,36,.09); border: 1px solid var(--gold);
  color: var(--gold); border-radius: 10px; padding: 10px 12px;
  font-size: 12px; margin-bottom: 12px; line-height: 1.6;
}
.hint.err { background: rgba(248,113,113,.09); border-color: var(--danger); color: var(--danger); }
.hint.ok { background: rgba(110,231,183,.09); border-color: var(--accent); color: var(--accent); }

/* ========== 日志 ========== */
.log {
  font-family: ui-monospace, monospace; font-size: 11px;
  background: #06090f; border: 1px solid var(--border); border-radius: 10px;
  padding: 10px; max-height: 180px; overflow: auto;
  white-space: pre-wrap; word-break: break-all; color: #cbd5e1;
}
.log div { padding: 1px 0; }
.log .ok { color: #86efac; }
.log .err { color: #fca5a5; }
.log .info { color: #93c5fd; }

/* ========== 底部 Tab ========== */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
  background: rgba(21,28,44,.96);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex; padding-bottom: var(--safe-bottom);
}
.tab {
  flex: 1; padding: 9px 0 8px; text-align: center; cursor: pointer;
  color: var(--muted); font-size: 10px; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tab .ti { font-size: 19px; line-height: 1; }
.tab.active { color: var(--accent); }
.tab:active { opacity: .7; }

/* ========== Toast ========== */
.toast {
  position: fixed; bottom: calc(78px + var(--safe-bottom)); left: 50%;
  transform: translateX(-50%);
  background: var(--card-2); border: 1px solid var(--border);
  padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
  z-index: 300; max-width: 88vw; text-align: center;
  box-shadow: 0 6px 24px rgba(0,0,0,.45);
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translate(-50%, 14px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.toast.success { border-color: var(--accent); color: var(--accent); }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* ========== 遮罩 ========== */
.mask {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(6,9,15,.72);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px; color: var(--muted); font-size: 13px;
}
.spinner {
  width: 26px; height: 26px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========== 桌面微调（依然是窄栏，手机为主） ========== */
@media (min-width: 768px) {
  .main { padding: 18px 14px 8px; }
  .game-grid { grid-template-columns: repeat(3, 1fr); }
  .game-icon { font-size: 36px; }
}
@media (max-width: 340px) {
  .game-grid { gap: 8px; }
  .game-card { padding: 12px 6px; min-height: 92px; }
  .game-icon { font-size: 26px; }
  .chip { max-width: 78px; font-size: 10px; }
}

/* ========== 设置菜单（参照三国卡牌设置，适配大厅暗色主题） ========== */
.settings-wrap { position: relative; }
.settings-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--card-2); border: 1px solid var(--border);
  color: var(--text); font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .3s, background .15s, color .15s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.settings-btn:hover { background: rgba(110,231,183,.15); transform: rotate(90deg); color: var(--accent); }
.settings-menu {
  display: none; position: absolute; top: 42px; right: 0;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  min-width: 188px; flex-direction: column; gap: 2px; z-index: 400;
}
.settings-menu.open { display: flex; animation: sgFadeIn .18s ease; }
@keyframes sgFadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.settings-menu .menu-item {
  background: transparent; border: none; color: var(--text);
  padding: 9px 12px; font-size: 13px; font-family: inherit; cursor: pointer;
  border-radius: 8px; text-align: left; transition: background .15s, color .15s;
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.settings-menu .menu-item:hover { background: var(--card-2); color: var(--accent); }
.settings-menu .menu-item .check { color: var(--accent); font-weight: 700; width: 14px; display: inline-block; }
.settings-menu .menu-item.danger:hover { background: rgba(248,113,113,.15); color: var(--danger); }
.settings-menu .menu-divider { height: 1px; background: var(--border); margin: 4px 8px; }
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="logo">🎮</div>
    <div class="brand-name" id="pageTitle">游戏大厅</div>
  </div>
  <div class="hdr-right">
    <span class="chip bal" id="hdrBal" style="display:none">—</span>
    <span class="chip" id="hdrAddr" style="display:none">—</span>
    <button class="btn btn-primary btn-sm" id="btnConnect" style="display:none" onclick="connectWallet()" data-i18n="btn_connect">连接</button>
    <div class="settings-wrap">
      <button class="settings-btn" id="btnSettings" onclick="toggleSettingsMenu()" title="设置">⚙️</button>
      <div class="settings-menu" id="settingsMenu">
        <button class="menu-item" id="langZhBtn" onclick="switchLang('zh');toggleSettingsMenu()">🇨🇳 中文</button>
        <button class="menu-item" id="langEnBtn" onclick="switchLang('en');toggleSettingsMenu()">🇺🇸 English</button>
        <div class="menu-divider"></div>
        <button class="menu-item" data-i18n="menu_deposit" onclick="switchTab('wallet');toggleSettingsMenu()">💰 充值</button>
        <button class="menu-item" data-i18n="menu_withdraw" onclick="switchTab('wallet');toggleSettingsMenu()">💳 提现</button>
        <div class="menu-divider"></div>
        <button class="menu-item" data-i18n="menu_pump" onclick="openPump();toggleSettingsMenu()">🚀 个性化发币</button>
        <button class="menu-item" data-i18n="menu_burn" onclick="openBurn();toggleSettingsMenu()">🔥 燃烧代币</button>
        <div class="menu-divider"></div>
        <button class="menu-item danger" data-i18n="menu_reset" onclick="hardReset();toggleSettingsMenu()">🔄 重置数据</button>
      </div>
    </div>
  </div>
</header>

<main class="main" id="main"></main>

<nav class="tabbar">
  <div class="tab active" data-tab="home"  onclick="switchTab('home')"><span class="ti">🎮</span><span data-i18n="tab_home">大厅</span></div>
  <div class="tab"        data-tab="wallet" onclick="switchTab('wallet')"><span class="ti">💰</span><span data-i18n="tab_wallet">钱包</span></div>
  <div class="tab"        data-tab="me"     onclick="switchTab('me')"><span class="ti">👤</span><span data-i18n="tab_me">我的</span></div>
</nav>

<script src="https://mainnet-api.paxinet.io/resources/js/paxi-cosmjs.umd.js"></script>

<!-- 🟢 无感签名：CosmJS ESM 供会话私钥直接签 Tx（与 UMD 的 PaxiCosmJS 并存） -->
<script type="module">
  window.addEventListener('load', async () => {
    try {
      const { DirectSecp256k1Wallet } = await import('https://cdn.jsdelivr.net/npm/@cosmjs/proto-signing@0.32.4/+esm');
      const { SigningStargateClient, GasPrice } = await import('https://cdn.jsdelivr.net/npm/@cosmjs/stargate@0.32.4/+esm');
      window.CosmJSSigning = { DirectSecp256k1Wallet, SigningStargateClient, GasPrice };
      window.dispatchEvent(new Event('cosmjs-ready'));
    } catch (e) { console.warn('CosmJS ESM 加载失败:', e.message); }
  });
</script>
<!-- 🟢 noble 加密库（会话密钥签名用）；⚠️ 必须注入 hmacSha256Sync -->
<script type="module">
  import * as secp from 'https://cdn.jsdelivr.net/npm/@noble/secp256k1@2.1.0/+esm';
  import { sha256 } from 'https://cdn.jsdelivr.net/npm/@noble/hashes@1.5.0/sha256/+esm';
  import { ripemd160 } from 'https://cdn.jsdelivr.net/npm/@noble/hashes@1.5.0/ripemd160/+esm';
  import { hmac } from 'https://cdn.jsdelivr.net/npm/@noble/hashes@1.5.0/hmac/+esm';

  // 🔴 关键：noble-secp256k1 v2.x 不再内置 HMAC，必须手动注入。
  //    不加这行，secp.sign() 会抛 "etc.hmacSha256Sync not set"。
  secp.etc.hmacSha256Sync = (key, ...msgs) =>
    hmac(sha256, key, secp.etc.concatBytes(...msgs));

  window.nobleSecp = secp;
  window.nobleSha256 = sha256;
  window.nobleRipemd160 = ripemd160;
  window.dispatchEvent(new Event('noble-ready'));
</script>
<script>window.HUB_BUILD = '20260918-1';</script>
<script src="shared.js?v=20260918-1"></script>      <!-- 网络/交易基础 -->
<script src="session.js?v=20260918-1"></script>     <!-- 无感签名（依赖 shared） -->
<script src="games.js?v=20260918-1"></script>       <!-- 通用引擎 + 游戏注册表 -->
<script src="sanguo.js?v=20260918-1"></script>      <!-- 三国：依赖 session 的 Session.buildMessage -->
<!-- 🟠 修复：crazydice.js 此前只有注释没有 <script> 标签，疯狂骰子从未注册进
     GAME_REGISTRY → 大厅里该游戏点不进去。依赖 games.js / shared.js，
     必须在 app.js 之前加载。 -->
<script src="crazydice.js?v=20260918-1"></script>   <!-- 疯狂骰子：依赖 games.js 的 diceSpecificMult -->
<script src="app.js?v=20260918-1"></script>         <!-- 入口/UI，必须最后加载 -->
<script>console.log('[PaxiGameHub] build =', window.HUB_BUILD);</script>
